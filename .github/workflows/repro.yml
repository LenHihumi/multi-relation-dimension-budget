name: repro

# The artifact's claim is "bash repro.sh rebuilds every table from the released JSON
# and the two agree".  A claim nobody runs rots, so it runs here on every push: two
# Python versions, a clean checkout, nothing but pip and numpy.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  repro:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # requirements.txt pins the build path only (numpy).  faiss and matplotlib
      # are commented out there because they need data this repository does not
      # contain; repro.sh rebuilds the figures only when matplotlib is present, and
      # skips them cleanly when it is not.
      - name: Install the build path
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -c "import sys, numpy; print(sys.version); print('numpy', numpy.__version__)"

      - name: Rebuild the tables from the released data
        run: bash repro.sh

      - name: The rebuild reproduces the committed tables byte for byte
        # repro.sh has just rewritten tables/ and figs/ from data/.  If git sees a
        # difference, either the commit is stale or the build is not deterministic
        # (a CRLF translation, a timestamp in a PDF), and a reader who runs the
        # command would get a dirty tree instead of the files this repository
        # claims to contain.
        run: |
          if [ -n "$(git status --porcelain -- tables figs)" ]; then
            echo "::error::the rebuild did not reproduce the committed tables"
            git status --short -- tables figs
            git diff --stat -- tables figs
            exit 1
          fi
          echo "rebuild is byte-identical: $(ls tables | wc -l) tables, $(ls figs | wc -l) figures"

      - name: Keep the rebuilt tables
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tables-py${{ matrix.python-version }}
          path: tables/
          retention-days: 14
